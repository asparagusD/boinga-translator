[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boinga-translator"
version = "0.0.1"
description = "Fine-tune a pretrained Bangla VITS into a single-speaker Chittagonian TTS proof of concept."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "soundfile",
    "librosa",
    "numpy",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
train = ["coqui-tts==0.28.0"]
dev = ["pytest", "ruff"]

[project.scripts]
boinga = "boinga_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
