[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boinga-translator"
version = "0.0.1"
description = "Fine-tune a pretrained Bangla VITS into a single-speaker Chittagonian TTS proof of concept."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "soundfile",
    "librosa",
    "numpy",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
train = ["coqui-tts==0.28.0"]
dev = ["pytest", "ruff", "nbformat"]

[project.scripts]
boinga = "boinga_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated by tools/build_notebook.py from linted specs (one-line "import; call" cells).
extend-exclude = ["notebooks/runs"]

[tool.ruff.lint.per-file-ignores]
# Colab cell files: every "# %%" cell is pasted and re-run on its own, so it re-imports.
"notebooks/*" = ["F811"]
